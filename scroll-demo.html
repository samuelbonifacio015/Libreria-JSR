<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll Demo - JSR Librería</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", Arial, Helvetica, sans-serif;
      }

      body {
        background-color: #f8f8f8;
        padding: 20px;
      }

      .demo-container {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
        margin-bottom: 30px;
        color: #19416f;
      }

      .section {
        margin-bottom: 40px;
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .section-title {
        font-size: 24px;
        font-weight: 600;
        color: #333;
      }

      .product-container {
        position: relative;
        overflow: hidden;
        padding: 0 60px;
      }

      .product-scroll {
        display: flex;
        overflow-x: hidden;
        scroll-behavior: smooth;
        gap: 0;
        transition: transform 0.3s ease;
        width: max-content;
      }

      .product-card {
        flex: 0 0 250px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 15px;
        margin-right: 15px;
        text-align: center;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        min-height: 400px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      }

      .product-card:last-child {
        margin-right: 0;
      }

      .discount {
        position: absolute;
        top: 10px;
        left: 10px;
        background: #ff4500;
        color: white;
        padding: 5px 8px;
        border-radius: 50px;
        font-size: 12px;
        font-weight: bold;
      }

      .product-image {
        width: 100%;
        height: 180px;
        object-fit: contain;
        margin-bottom: 15px;
        border-radius: 5px;
      }

      .brand {
        font-size: 12px;
        color: #666;
        margin-bottom: 5px;
        text-transform: uppercase;
      }

      .product-name {
        font-size: 14px;
        font-weight: 500;
        color: #333;
        margin-bottom: 10px;
        line-height: 1.3;
      }

      .price {
        margin: 10px 0;
      }

      .original-price {
        text-decoration: line-through;
        color: #999;
        font-size: 14px;
      }

      .discounted-price {
        font-size: 18px;
        font-weight: bold;
        color: #000;
      }

      .availability {
        color: #388d38;
        font-size: 12px;
        margin-bottom: 15px;
      }

      .btn {
        padding: 8px 15px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        transition: all 0.3s ease;
        margin: 2px 0;
      }

      .btn-primary {
        background: #00aeef;
        color: white;
      }

      .btn-primary:hover {
        background: #0088cc;
      }

      .btn-secondary {
        background: transparent;
        color: #00aeef;
        border: 1px solid #00aeef;
      }

      .btn-secondary:hover {
        background: #00aeef;
        color: white;
      }

      .nav-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.8);
        color: white;
        border: none;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        font-size: 18px;
        cursor: pointer;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        opacity: 0;
        visibility: hidden;
      }

      .nav-arrow.visible {
        opacity: 1;
        visibility: visible;
      }

      .nav-arrow:hover {
        background: rgba(0, 0, 0, 1);
        transform: translateY(-50%) scale(1.1);
      }

      .nav-arrow.prev {
        left: 10px;
      }

      .nav-arrow.next {
        right: 10px;
      }

      .product-container:hover .nav-arrow.visible {
        opacity: 1;
        visibility: visible;
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: #666;
      }

      .error {
        text-align: center;
        padding: 40px;
        color: #ff4500;
      }

      @media (max-width: 768px) {
        .product-container {
          padding: 0 50px;
        }

        .nav-arrow {
          width: 40px;
          height: 40px;
          font-size: 16px;
        }

        .nav-arrow.prev {
          left: 5px;
        }

        .nav-arrow.next {
          right: 5px;
        }

        .product-card {
          flex: 0 0 200px;
          margin-right: 10px;
        }
      }

      @media (max-width: 480px) {
        .product-container {
          padding: 0 40px;
        }

        .product-card {
          flex: 0 0 180px;
        }
      }
    </style>
  </head>
  <body>
    <div class="demo-container">
      <h1>🚀 Demo Scroll Horizontal con Flechas</h1>

      <div class="section">
        <div class="section-header">
          <h2 class="section-title">Promociones</h2>
        </div>
        <div class="product-container" data-section="promotion">
          <button
            class="nav-arrow prev"
            onclick="scrollSection('promotion', -1)"
          >
            <i class="fas fa-chevron-left"></i>
          </button>
          <div class="product-scroll" id="promotion-scroll">
            <div class="loading">Cargando productos...</div>
          </div>
          <button
            class="nav-arrow next"
            onclick="scrollSection('promotion', 1)"
          >
            <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      </div>

      <div class="section">
        <div class="section-header">
          <h2 class="section-title">Diseño & Dibujo</h2>
        </div>
        <div class="product-container" data-section="design">
          <button class="nav-arrow prev" onclick="scrollSection('design', -1)">
            <i class="fas fa-chevron-left"></i>
          </button>
          <div class="product-scroll" id="design-scroll">
            <div class="loading">Cargando productos...</div>
          </div>
          <button class="nav-arrow next" onclick="scrollSection('design', 1)">
            <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      </div>

      <div class="section">
        <div class="section-header">
          <h2 class="section-title">Infantil</h2>
        </div>
        <div class="product-container" data-section="infantil">
          <button
            class="nav-arrow prev"
            onclick="scrollSection('infantil', -1)"
          >
            <i class="fas fa-chevron-left"></i>
          </button>
          <div class="product-scroll" id="infantil-scroll">
            <div class="loading">Cargando productos...</div>
          </div>
          <button class="nav-arrow next" onclick="scrollSection('infantil', 1)">
            <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      </div>
    </div>

    <script>
      let currentPositions = {
        promotion: 0,
        design: 0,
        infantil: 0,
      };

      function getScrollAmount() {
        if (window.innerWidth <= 480) {
          return 195; // 180px + 15px margin
        } else if (window.innerWidth <= 768) {
          return 215; // 200px + 15px margin
        }
        return 265; // 250px + 15px margin
      }

      async function loadProducts() {
        try {
          const response = await fetch("/partials/products.json");
          const data = await response.json();

          const promotionProducts = data
            .filter(
              (product) =>
                product.brand === "FABER-CASTELL" ||
                product.brand === "CASIO" ||
                product.brand === "LOGITECH" ||
                product.brand === "PIGMA-MICRON" ||
                product.brand === "XIAOMI" ||
                product.brand === "CATRICE" ||
                product.brand === "SONY" ||
                product.brand === "MARVEL"
            )
            .slice(0, 12);

          const designProducts = data
            .filter(
              (product) =>
                product.productName.toLowerCase().includes("lapices") ||
                product.productName.toLowerCase().includes("marcador") ||
                product.productName.toLowerCase().includes("portaminas") ||
                product.productName.toLowerCase().includes("bitacora") ||
                product.productName.toLowerCase().includes("corrector") ||
                product.brand === "FABER-CASTELL" ||
                product.brand === "PIGMA-MICRON" ||
                product.brand === "VINIFAN"
            )
            .slice(0, 10);

          const infantilProducts = data
            .filter(
              (product) =>
                product.productName.toLowerCase().includes("plastilina") ||
                product.productName.toLowerCase().includes("acuarelas") ||
                product.productName.toLowerCase().includes("crayones") ||
                product.productName.toLowerCase().includes("peluche") ||
                product.productName.toLowerCase().includes("plumones") ||
                product.brand === "ARTESCO"
            )
            .slice(0, 8);

          renderProducts("promotion-scroll", promotionProducts);
          renderProducts("design-scroll", designProducts);
          renderProducts("infantil-scroll", infantilProducts);

          // Esperar a que se rendericen completamente y luego actualizar flechas
          setTimeout(() => {
            // Forzar que las flechas "next" sean visibles inicialmente si hay contenido
            updateArrowVisibility();

            // Mostrar flechas "next" iniciales
            Object.keys(currentPositions).forEach((section) => {
              const container = document.getElementById(`${section}-scroll`);
              if (container) {
                const productCards =
                  container.querySelectorAll(".product-card");
                const sectionContainer =
                  container.closest(".product-container");
                const nextBtn =
                  sectionContainer?.querySelector(".nav-arrow.next");

                if (productCards.length > 0 && nextBtn) {
                  const containerWidth = sectionContainer.offsetWidth - 120;
                  let cardWidth = 250;
                  if (window.innerWidth <= 480) {
                    cardWidth = 180;
                  } else if (window.innerWidth <= 768) {
                    cardWidth = 200;
                  }
                  const totalWidth = productCards.length * (cardWidth + 15);

                  if (totalWidth > containerWidth) {
                    nextBtn.classList.add("visible");
                  }
                }
              }
            });
          }, 200);
        } catch (error) {
          console.error("Error loading products:", error);
          document.querySelectorAll(".product-scroll").forEach((container) => {
            container.innerHTML =
              '<div class="error">Error al cargar productos</div>';
          });
        }
      }

      function renderProducts(containerId, products) {
        const container = document.getElementById(containerId);
        if (!container || !products.length) return;

        container.innerHTML = products
          .map(
            (product) => `
                <div class="product-card">
                    <div class="discount">${product.discount}</div>
                    <img src="${product.img}" alt="${product.alt}" class="product-image" />
                    <div class="brand">${product.brand}</div>
                    <div class="product-name">${product.productName}</div>
                    <div class="price">
                        <div class="original-price">${product.priceOriginal}</div>
                        <div class="discounted-price">${product.priceDiscounted}</div>
                    </div>
                    <div class="availability">${product.availability}</div>
                    <button class="btn btn-primary">Añadir al carrito</button>
                    <button class="btn btn-secondary">Vista rápida</button>
                </div>
            `
          )
          .join("");
      }

      function scrollSection(section, direction) {
        const container = document.getElementById(`${section}-scroll`);
        if (!container) return;

        const parentContainer = container.parentElement;
        const containerWidth = parentContainer.offsetWidth - 120; // 60px padding each side

        // Calcular el ancho total basado en productos reales y tamaño de pantalla
        const productCards = container.querySelectorAll(".product-card");
        let cardWidth = 250;
        if (window.innerWidth <= 480) {
          cardWidth = 180;
        } else if (window.innerWidth <= 768) {
          cardWidth = 200;
        }
        const totalWidth = productCards.length * (cardWidth + 15); // card width + margin

        const maxScroll = Math.max(0, totalWidth - containerWidth);

        currentPositions[section] += getScrollAmount() * direction;
        currentPositions[section] = Math.max(
          0,
          Math.min(currentPositions[section], maxScroll)
        );

        container.style.transform = `translateX(-${currentPositions[section]}px)`;

        setTimeout(() => {
          updateArrowVisibility();
        }, 300);
      }

      function updateArrowVisibility() {
        Object.keys(currentPositions).forEach((section) => {
          const container = document.getElementById(`${section}-scroll`);
          if (!container) return;

          const sectionContainer = container.closest(".product-container");
          const prevBtn = sectionContainer.querySelector(".nav-arrow.prev");
          const nextBtn = sectionContainer.querySelector(".nav-arrow.next");

          if (!prevBtn || !nextBtn) return;

          const containerWidth = sectionContainer.offsetWidth - 120;

          // Usar la misma lógica de cálculo responsive
          const productCards = container.querySelectorAll(".product-card");
          let cardWidth = 250;
          if (window.innerWidth <= 480) {
            cardWidth = 180;
          } else if (window.innerWidth <= 768) {
            cardWidth = 200;
          }
          const totalWidth = productCards.length * (cardWidth + 15);
          const maxScroll = Math.max(0, totalWidth - containerWidth);

          if (maxScroll <= 0) {
            prevBtn.classList.remove("visible");
            nextBtn.classList.remove("visible");
            return;
          }

          // Mostrar flecha izquierda si no estamos al inicio
          if (currentPositions[section] > 10) {
            prevBtn.classList.add("visible");
          } else {
            prevBtn.classList.remove("visible");
          }

          // Mostrar flecha derecha si no estamos al final
          if (currentPositions[section] < maxScroll - 10) {
            nextBtn.classList.add("visible");
          } else {
            nextBtn.classList.remove("visible");
          }
        });
      }

      window.addEventListener("resize", () => {
        Object.keys(currentPositions).forEach((section) => {
          currentPositions[section] = 0;
          const container = document.getElementById(`${section}-scroll`);
          if (container) {
            container.style.transform = "translateX(0px)";
          }
        });
        updateArrowVisibility();
      });

      document.addEventListener("DOMContentLoaded", loadProducts);
    </script>
  </body>
</html>
