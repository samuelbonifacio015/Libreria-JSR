<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Investigaciones - Librería JSR</title>

    <link rel="icon" href="../img/JSR.ico" type="image/x-icon" />

    <link rel="stylesheet" href="/partials/footer.css" />
    <link rel="stylesheet" href="/partials/navbar.css" />
    <link rel="stylesheet" href="/partials/headernav.css" />

    <link rel="stylesheet" href="/css/investigaciones.css" />
  </head>
  <body>
    <div class="main-wrapper">
      <!--navbar-->
      <div id="navbar-placeholder"></div>

      <!--headernav-->
      <div id="headernav-placeholder"></div>

      <div class="content-container">
        <div class="working-notice">
          <div class="notice-content">
            <div class="svg-container">
              <svg
                class="gear gear-1"
                viewBox="0 0 100 100"
                width="80"
                height="80"
              >
                <path
                  d="M50 0 L60 20 L80 20 L65 35 L70 55 L50 45 L30 55 L35 35 L20 20 L40 20 Z"
                  fill="#4A90E2"
                />
                <circle cx="50" cy="50" r="8" fill="#2C3E50" />
              </svg>
              <svg
                class="gear gear-2"
                viewBox="0 0 100 100"
                width="60"
                height="60"
              >
                <path
                  d="M50 0 L60 20 L80 20 L65 35 L70 55 L50 45 L30 55 L35 35 L20 20 L40 20 Z"
                  fill="#E74C3C"
                />
                <circle cx="50" cy="50" r="6" fill="#2C3E50" />
              </svg>
              <svg
                class="gear gear-3"
                viewBox="0 0 100 100"
                width="40"
                height="40"
              >
                <path
                  d="M50 0 L60 20 L80 20 L65 35 L70 55 L50 45 L30 55 L35 35 L20 20 L40 20 Z"
                  fill="#F39C12"
                />
                <circle cx="50" cy="50" r="4" fill="#2C3E50" />
              </svg>
            </div>

            <h1 class="title">¡Estamos Trabajando!</h1>
            <p class="message">
              Esta página está en construcción. Nuestro equipo está trabajando
              para traerte contenido increíble.
            </p>

            <div class="progress-bar">
              <div class="progress-fill"></div>
            </div>

            <div class="status">
              <span class="status-text">Desarrollo en progreso</span>
              <div class="dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
              </div>
            </div>

            <div class="features-preview">
              <h3>Próximamente:</h3>
              <ul class="features-list">
                <li>Investigaciones académicas</li>
                <li>Recursos de estudio</li>
                <li>Base de datos de tesis</li>
                <li>Herramientas de investigación</li>
              </ul>
            </div>

            <a href="../index.html" class="back-button">Volver al Inicio</a>
          </div>
        </div>
      </div>

      <!--footer-->
      <div id="footer-placeholder"></div>
    </div>

    <!--scripts-->
    <script src="/js/load-content.js"></script>
    <script src="/js/dropdown.js"></script>
    <script src="/js/mobile.js"></script>
    <script src="/js/contacto.js"></script>
  </body>
</html>
