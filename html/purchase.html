<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finalizar Compra - Librería JSR</title>
    <link rel="icon" type="image/x-icon" href="/img/JSR.ico" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/purchase.css" />
    <script
      src="https://kit.fontawesome.com/a076d05399.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>

    <div class="purchase-container">
      <!-- header purchase -->
      <div class="header">
        <div class="logo">
          <img src="/img/JSR.ico" alt="JSR" />
        </div>

        <div class="steps">
          <div class="step active">
              <div class="step-number">1</div>
              <span>VERIFICAR DATOS</span>
          </div>
          <div class="step inactive">
              <div class="step-number">2</div>
              <span>RECOJO EN TIENDA</span>
          </div>
        </div>
      </div>

      <div class="main-content">
        <div class="form-section">
          <h2 class="section-title">VERIFICAR DATOS</h2>
          
          <!-- Formulario -->
          <form>
            <div class="form-row">
              <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required />
              </div>
              <div class="form-group">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" required />
              </div>
            </div>
            
            <div class="form-group full-width">
              <label for="contacto">Contacto</label>
              <input type="email" id="contacto" name="contacto" placeholder="Correo electrónico (opcional)"/>
            </div>

            <div class="form-group full-width">
              <label for="telefono">Telefono</label>
              <input type="tel" id="telefono" name="telefono" required />
            </div>

            <div class="form-group full-width">
              <label for="mensaje">Mensaje</label>
              <input type="mensaje" id="contacto" name="contacto" placeholder="Correo electrónico (opcional)"/>
            </div>

            <button type="submit" class="continue-btn">Continuar</button>
          </form>
        </div>

        <!-- Summary -->
        <div class="summary-section">
          <div class="order-summary">
            <h3 class="summary-title">RESUMEN DEL PEDIDO</h3>

            <div class="product-item">
              <div class="product-image"></div>
              <div class="product-details">
                <div class="product-name">PRODUCTO</div>
                <div class="product-brand">MARCA</div>
                <div class="product-quantity">CANTIDAD: 1</div>
                <div class="product-price">PRECIO: S/0.00</div>
              </div>
            </div>

            <hr class="summary-divider">

            <div class="total">
              <span>Total:</span>
              <span class="total-amount">S/0.00</span>
            </div>
          </div>
        </div>
      </div>

    <!-- Scripts -->
    <script src="/js/purchase.js"></script>
  </body>
</html>
