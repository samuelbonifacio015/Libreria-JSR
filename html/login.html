<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión - JSR</title>

    <link rel="icon" href="/img/JSR.ico">

    <link rel="stylesheet" href="/css/auth.css" />
    <link rel="stylesheet" href="/partials/navbar.css" />
    <link rel="stylesheet" href="/partials/footer.css" />

     <!-- Iconos de FontAwesome -->
    <link
     href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
     rel="stylesheet"
    />

</head>

<body>
    <!--navbar-->
    <div id="navbar-placeholder"></div>


    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Iniciar Sesión</h2>
                <p>Accede a tu cuenta para realizar compras, ver tus pedidos y más.</p>
            </div>
            
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="Ingresa tu correo electrónico" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                        <i class="fas fa-eye toggle-password"></i>
                    </div>
                </div>
                
                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Recordarme</label>
                    </div>
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>
                
                <button type="submit" class="auth-button">Iniciar Sesión</button>
                
                <div class="divider">
                    <span>o</span>
                </div>
                
                <div class="social-login">
                    <button type="button" class="social-button google">
                        <i class="fab fa-google"></i>
                        Continuar con Google
                    </button>
                    <button type="button" class="social-button facebook">
                        <i class="fab fa-facebook-f"></i>
                        Continuar con Facebook
                    </button>
                </div>
            </form>
            
            <div class="auth-footer">
                <p>¿No tienes una cuenta? <a href="/html/register.html">Regístrate aquí</a></p>
            </div>
        </div>
    </div>

    <!--footer-->
    <div id="footer-placeholder"></div>

    <!--scripts-->
    <script src="../js/load-content.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
