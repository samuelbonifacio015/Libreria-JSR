<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catalogo - JSR</title>

    <link rel="icon" href="/img/JSR.ico">

    <link rel="stylesheet" href="/css/catalogo.css" />
    <link rel="stylesheet" href="/partials/navbar.css" />
    <link rel="stylesheet" href="/partials/footer.css" />
    <link rel="stylesheet" href="/partials/headernav.css" />

     <!-- Iconos de FontAwesome -->
    <link
     href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
     rel="stylesheet"
    />

</head>

<body>
    <!--navbar-->
    <div id="navbar-placeholder"></div>

    <!--headernav-->
    <div id="headernav-placeholder"></div>

    <div class="index-page">
      <h4>Inicio</h4> <i class="fa-solid fa-angle-right"></i></h4> <h4>Objetos</h4>
    </div>

    <!--catalogo aside start-->
    <div class="catalogo-container">

      <aside class="catalogo-filter">
        <h2>Filtros</h2>
        <div class="filter-group">
          <h3>Marca <i class="fa-solid fa-angle-down"></i></h3>
          <ul>
            <label><input type="checkbox" data-filter="brand" value="ARTESCO" />ARTESCO</label>
            <label><input type="checkbox" data-filter="brand" value="ARTI CREATIVO" />ARTI CREATIVO</label>
            <label><input type="checkbox" data-filter="brand" value="CASIO" />CASIO</label>
            <label><input type="checkbox" data-filter="brand" value="CATRICE" />CATRICE</label>
            <label><input type="checkbox" data-filter="brand" value="EDICIONES OBELISCO" />EDICIONES OBELISCO</label>
            <label><input type="checkbox" data-filter="brand" value="FABER-CASTELL" />FABER-CASTELL</label>
            <label><input type="checkbox" data-filter="brand" value="LOGITECH" />LOGITECH</label>
            <label><input type="checkbox" data-filter="brand" value="MARVEL" />MARVEL</label>
            <label><input type="checkbox" data-filter="brand" value="MILAN" />MILAN</label>
            <label><input type="checkbox" data-filter="brand" value="PIGMA-MICRON" />PIGMA-MICRON</label>
            <label><input type="checkbox" data-filter="brand" value="SONY" />SONY</label>
            <label><input type="checkbox" data-filter="brand" value="STICK'N-NOTES" />STICK'N-NOTES</label>
            <label><input type="checkbox" data-filter="brand" value="VINIFAN" />VINIFAN</label>
            <label><input type="checkbox" data-filter="brand" value="XIAOMI" />XIAOMI</label>
          </ul>

          <h3>Precio <i class="fa-solid fa-angle-down"></i></h3>
          <div class="price-filter">
            <div class="price-range">
              <div class="price-values">
                <input type="number" class="min-price" min="0" max="169" value="0">
                <input type="number" class="max-price" min="0" max="169" value="169">
              </div>
              <div class="slider-container">
                <input type="range" class="slider" min="0" max="100" value="100">
              </div>
            </div>
          </div>
        </div>
      </aside>
      <!--catalogo aside end-->

      <!--catalogo products start-->
      <section class="products">
        <h2>I TODOS LOS PRODUCTOS</h2>
        <div class="products-header">
          <div class="products-count">Mostrando 1 - 24 de 24 productos</div>
          <div class="products-controls">
            <div class="sort-control">
              <label>Ordenar por: </label>
              <select id="sortSelect" aria-label="Ordenar productos">
                <option value="popular">Más vendidos</option>
                <option value="price-asc">Precio: menor a mayor</option>
                <option value="price-desc">Precio: mayor a menor</option>
                <option value="name-asc">Nombre: A-Z</option>
                <option value="name-desc">Nombre: Z-A</option>
                <option value="newest">Más recientes</option>
                <option value="rating">Mejor valorados</option>
              </select>
            </div>

            <div class="filter-control">
              <button class="filter-btn" id="filterBtn" aria-label="Abrir filtros">
                <i class="fa-solid fa-filter"></i>
                <span>Filtros</span>
              </button>
            </div>

            <div class="view-control">
              <span>Ver</span>
              <button class="grid-view active" data-view="grid" aria-label="Vista en cuadrícula">
                <i class="fa-solid fa-grip"></i>
              </button>
              <button class="list-view" data-view="list" aria-label="Vista en lista">
                <i class="fa-solid fa-list"></i>
              </button>
            </div>

          </div>
        </div>        
        <div class="products-grid">
          <!--los archivos aqui seran generados por js-->
        </div>

        <!-- pagination start -->
        <div class="pagination">
          <a href="#" class="pagination-item active">1</a>
          <a href="#" class="pagination-item">2</a>
          <a href="#" class="pagination-item">3</a>
          <div class="pagination-dots">...</div>
          <a href="#" class="pagination-item">5</a>
          <a href="#" class="pagination-next">Siguiente <i class="fa-solid fa-angle-right"></i></a>
        </div>

        <button class="back-to-top" aria-label="Volver al inicio">
          <i class="fa-solid fa-chevron-up"></i>
        </button>
        <!-- pagination end -->

      </section>
    </div>

    <!-- Modal de filtros responsive -->
    <div class="filter-modal" id="filterModal">
      <div class="filter-modal-content">
        <div class="filter-modal-header">
          <h3>Filtros</h3>
          <button class="filter-modal-close" id="filterModalClose" aria-label="Cerrar filtros">
            <i class="fa-solid fa-times"></i>
          </button>
        </div>
        
        <div class="filter-modal-body">
          <div class="filter-section">
            <h4>Marca <i class="fa-solid fa-angle-down"></i></h4>
            <div class="filter-options">
              <label><input type="checkbox" data-filter="brand" value="ARTESCO" />ARTESCO</label>
              <label><input type="checkbox" data-filter="brand" value="ARTI CREATIVO" />ARTI CREATIVO</label>
              <label><input type="checkbox" data-filter="brand" value="CASIO" />CASIO</label>
              <label><input type="checkbox" data-filter="brand" value="CATRICE" />CATRICE</label>
              <label><input type="checkbox" data-filter="brand" value="EDICIONES OBELISCO" />EDICIONES OBELISCO</label>
              <label><input type="checkbox" data-filter="brand" value="FABER-CASTELL" />FABER-CASTELL</label>
              <label><input type="checkbox" data-filter="brand" value="LOGITECH" />LOGITECH</label>
              <label><input type="checkbox" data-filter="brand" value="MARVEL" />MARVEL</label>
              <label><input type="checkbox" data-filter="brand" value="MILAN" />MILAN</label>
              <label><input type="checkbox" data-filter="brand" value="PIGMA-MICRON" />PIGMA-MICRON</label>
              <label><input type="checkbox" data-filter="brand" value="SONY" />SONY</label>
              <label><input type="checkbox" data-filter="brand" value="STICK'N-NOTES" />STICK'N-NOTES</label>
              <label><input type="checkbox" data-filter="brand" value="VINIFAN" />VINIFAN</label>
              <label><input type="checkbox" data-filter="brand" value="XIAOMI" />XIAOMI</label>
            </div>
          </div>

          <div class="filter-section">
            <h4>Precio <i class="fa-solid fa-angle-down"></i></h4>
            <div class="price-filter-modal">
              <div class="price-range-modal">
                <div class="price-values-modal">
                  <input type="number" class="min-price-modal" min="0" max="169" value="0" placeholder="Mínimo" aria-label="Precio mínimo">
                  <input type="number" class="max-price-modal" min="0" max="169" value="169" placeholder="Máximo" aria-label="Precio máximo">
                </div>
                <div class="slider-container-modal">
                  <input type="range" class="slider-modal" min="0" max="100" value="100" aria-label="Rango de precio">
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="filter-modal-footer">
          <button class="filter-apply-btn" id="filterApplyBtn">Aplicar Filtros</button>
          <button class="filter-clear-btn" id="filterClearBtn">Limpiar</button>
        </div>
      </div>
    </div>
    <!--whatsapp contact-->
    <div class="whatsapp-contact">
      <a href="https://wa.me/999451887" target="_blank" rel="noopener" class="whatsapp-message">
        Realiza tu pedido aquí 🚀
      </a>
      <a href="https://wa.me/999451887" target="_blank" rel="noopener" class="whatsapp-icon">
        <i class="fab fa-whatsapp"></i>
      </a>
    </div>
    <!--whatsapp cc end-->

    <!--floating cart start-->
    <div class="floating-cart" id="floatingCart">
      <div class="floating-cart-icon">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="floating-cart-count" id="floatingCartCount">0</span>
      </div>
      <div class="floating-cart-preview">
        <div class="floating-cart-preview-title">Carrito de Compras</div>
        <div class="floating-cart-items" id="floatingCartItems">
          <!-- items auto adding -->
        </div>
        <div class="floating-cart-total">
          <span>Total:</span>
          <span>S/. <span id="floatingCartTotal">0.00</span></span>
        </div>
        <div class="floating-cart-actions">
          <button class="floating-cart-view-cart">Ver Carrito</button>
          <button class="floating-cart-checkout">Comprar</button>
        </div>
      </div>
    </div>
    <!--floating cart end-->

    <!--footer-->
    <div id="footer-placeholder"></div>

    <!--scripts-->
    <script src="../js/load-content.js"></script>
    <script src="../js/shop.js"></script>
    <script src="../js/search.js"></script>
    <script src="../js/dropdown.js"></script>
    <script src="../js/catalogo.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/mobile.js"></script>
    <script>
        // Script para probar el carrito
        document.addEventListener('DOMContentLoaded', function() {
            document.addEventListener('navbarLoaded', function() {
                console.log('Navbar cargado en catálogo');
                
                // Debug del carrito después de 2 segundos
                setTimeout(() => {
                    if (window.debugCart) {
                        window.debugCart();
                    }
                }, 2000);
            });
            
            // Función de prueba para añadir productos
            window.testAddToCart = function() {
                const testProduct = {
                    name: 'Producto de Prueba',
                    brand: 'Marca Test',
                    price: 25.99,
                    image: '/img/products/default.jpg',
                    quantity: 1
                };
                
                console.log('🧪 Probando añadir producto de prueba:', testProduct);
                
                if (window.addToCart) {
                    window.addToCart(testProduct);
                } else {
                    console.error('❌ Función addToCart no disponible');
                }
            };
        });
    </script>
</body>
</html>
