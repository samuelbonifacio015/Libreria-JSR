<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro - JSR</title>

    <link rel="icon" href="/img/JSR.ico">

    <link rel="stylesheet" href="/css/auth.css" />
    <link rel="stylesheet" href="/partials/navbar.css" />
    <link rel="stylesheet" href="/partials/footer.css" />

     <!-- Iconos de FontAwesome -->
    <link
     href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
     rel="stylesheet"
    />

</head>

<body>
    <!--navbar-->
    <div id="navbar-placeholder"></div>


    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Crear Cuenta</h2>
                <p>Regístrate para disfrutar de una experiencia de compra personalizada.</p>
            </div>
            
            <form class="auth-form" id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">Nombre</label>
                        <div class="input-with-icon">
                            <i class="fas fa-user"></i>
                            <input type="text" id="firstName" name="firstName" placeholder="Ingresa tu nombre" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="lastName">Apellido</label>
                        <div class="input-with-icon">
                            <i class="fas fa-user"></i>
                            <input type="text" id="lastName" name="lastName" placeholder="Ingresa tu apellido" required>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="Ingresa tu correo electrónico" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="phone">Teléfono</label>
                    <div class="input-with-icon">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="phone" name="phone" placeholder="Ingresa tu número de teléfono" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Crea una contraseña" required>
                        <i class="fas fa-eye toggle-password"></i>
                    </div>
                    <div class="password-strength">
                        <div class="strength-meter">
                            <div class="strength-segment"></div>
                            <div class="strength-segment"></div>
                            <div class="strength-segment"></div>
                        </div>
                        <span class="strength-text">Seguridad de la contraseña</span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirma tu contraseña" required>
                        <i class="fas fa-eye toggle-password"></i>
                    </div>
                </div>
                
                <div class="form-options">
                    <div class="terms-check">
                        <input type="checkbox" id="termsAccept" name="termsAccept" required>
                        <label for="termsAccept">Acepto los <a href="#">Términos y Condiciones</a> y la <a href="#">Política de Privacidad</a></label>
                    </div>
                </div>
                
                <button type="submit" class="auth-button">Crear Cuenta</button>
                
                <div class="divider">
                    <span>o</span>
                </div>
                
                <div class="social-login">
                    <button type="button" class="social-button google">
                        <i class="fab fa-google"></i>
                        Continuar con Google
                    </button>
                    <button type="button" class="social-button facebook">
                        <i class="fab fa-facebook-f"></i>
                        Continuar con Facebook
                    </button>
                </div>
            </form>
            
            <div class="auth-footer">
                <p>¿Ya tienes una cuenta? <a href="/html/login.html">Inicia sesión aquí</a></p>
            </div>
        </div>
    </div>

    <!--footer-->
    <div id="footer-placeholder"></div>

    <!--scripts-->
    <script src="../js/load-content.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
